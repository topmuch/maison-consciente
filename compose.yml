# ═══════════════════════════════════════════════════════════════
# MAISON CONSCIENTE — Coolify Docker Compose
# 
# Usage: Import this file in Coolify as "Public Repository" 
# or use "Based on Docker Compose" resource type.
# ═══════════════════════════════════════════════════════════════

services:
  app:
    image: ${IMAGE:-ghcr.io/topmuch/maison-consciente:latest}
    container_name: maison-consciente-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?❌ DATABASE_URL is required — e.g. postgresql://user:pass@db:5432/maison_consciente}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - VAULT_AES_KEY=${VAULT_AES_KEY:?❌ VAULT_AES_KEY is required — generate with: openssl rand -hex 32}
      - CRON_SECRET=${CRON_SECRET:-}
      # Optional services
      - REDIS_URL=${REDIS_URL:-}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # AI Services
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - RETELL_API_KEY=${RETELL_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DEEPL_API_KEY=${DEEPL_API_KEY:-}
      - FOURSQUARE_API_KEY=${FOURSQUARE_API_KEY:-}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
      # Notifications
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID:-}
      - ONESIGNAL_REST_KEY=${ONESIGNAL_REST_KEY:-}
      # Analytics
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-}
      # Error tracking
      - SENTRY_DSN=${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: maison-consciente-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-maison}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?❌ POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-maison_consciente}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maison} -d ${POSTGRES_DB:-maison_consciente}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
